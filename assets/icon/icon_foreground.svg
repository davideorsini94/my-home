<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00A08A"/>
      <stop offset="1" stop-color="#00605A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4EFEC"/>
    </linearGradient>
  </defs>
  <g transform="translate(512 512) scale(0.66) translate(-512 -536)">

  

  <!-- handle, drawn behind the lid -->
  <rect x="432" y="236" width="160" height="74" rx="30" fill="#CFE3DE"/>
  <!-- lid -->
  <rect x="238" y="292" width="548" height="82" rx="34" fill="#FFFFFF"/>

  <!-- bin body: tapers towards the base, rounded at the bottom -->
  <path d="M282 404 H742 L700 786 a56 56 0 0 1 -56 50 H380 a56 56 0 0 1 -56 -50 Z"
        fill="url(#body)"/>

  <!-- sorted-waste streams: one stripe per colour of the app's palette -->
  <g>
    <rect x="360" y="470" width="76" height="286" rx="38" fill="#29B6F6"/>
    <rect x="474" y="470" width="76" height="286" rx="38" fill="#FDD835"/>
    <rect x="588" y="470" width="76" height="286" rx="38" fill="#43A047"/>
  </g>
</g>
</svg>
